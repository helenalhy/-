kind = "mobile"
previewPath = "/"
title = "Momentum 動力打卡"
description = "A mobile habit check-in app that helps people build momentum through small daily goals, satisfying check-ins, streaks, and personal progress. Stores habits and check-in history locally on the device."
version = "1.0.0"
id = "artifacts/momentum-checkin"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19897

[services.development]
run = "pnpm --filter @workspace/momentum-checkin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/momentum-checkin", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/momentum-checkin", "run", "serve" ]

[services.env]
PORT = "19897"
BASE_PATH = "/"
