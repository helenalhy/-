openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: progress
    description: Authenticated user progress synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get the signed-in user's saved progress
      responses:
        "200":
          description: Current user's saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "401":
          description: Authentication required
    put:
      operationId: saveProgress
      tags: [progress]
      summary: Save the signed-in user's progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressSnapshot"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "400":
          description: Invalid progress snapshot
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProgressSnapshot:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        habits:
          type: array
          items:
            type: object
            additionalProperties: true
        mall:
          type: object
          additionalProperties: true
      required:
        - schemaVersion
        - habits
        - mall
    ProgressRecord:
      type: object
      additionalProperties: false
      properties:
        exists:
          type: boolean
        snapshot:
          $ref: "#/components/schemas/ProgressSnapshot"
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - exists
        - snapshot
        - updatedAt

