openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: progress
    description: Authenticated user progress synchronization
  - name: reminders
    description: Browser push reminders for daily check-ins
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get the signed-in user's saved progress
      responses:
        "200":
          description: Current user's saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "401":
          description: Authentication required
    put:
      operationId: saveProgress
      tags: [progress]
      summary: Save the signed-in user's progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressSnapshot"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "400":
          description: Invalid progress snapshot
        "401":
          description: Authentication required
  /reminders/config:
    get:
      operationId: getReminderConfig
      tags: [reminders]
      summary: Get the public browser push key
      responses:
        "200":
          description: Push configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderConfig"
        "503":
          description: Push reminders are unavailable
  /reminders/subscription:
    put:
      operationId: saveReminderSubscription
      tags: [reminders]
      summary: Save this browser's daily reminder settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderSubscriptionInput"
      responses:
        "200":
          description: Reminder settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSubscription"
        "400":
          description: Invalid reminder settings
    post:
      operationId: deleteReminderSubscription
      tags: [reminders]
      summary: Remove this browser's daily reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUnsubscribeInput"
      responses:
        "200":
          description: Reminder disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderStatus"
  /reminders/check-in:
    put:
      operationId: updateReminderCheckInStatus
      tags: [reminders]
      summary: Update whether this browser has checked in today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderCheckInInput"
      responses:
        "200":
          description: Check-in reminder status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProgressSnapshot:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        habits:
          type: array
          items:
            type: object
            additionalProperties: true
        mall:
          type: object
          additionalProperties: true
      required:
        - schemaVersion
        - habits
        - mall
    ProgressRecord:
      type: object
      additionalProperties: false
      properties:
        exists:
          type: boolean
        snapshot:
          $ref: "#/components/schemas/ProgressSnapshot"
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - exists
        - snapshot
        - updatedAt
    ReminderConfig:
      type: object
      additionalProperties: false
      properties:
        publicKey:
          type: string
          minLength: 1
      required:
        - publicKey
    ReminderSubscriptionInput:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 4096
        p256dh:
          type: string
          minLength: 16
          maxLength: 512
        auth:
          type: string
          minLength: 8
          maxLength: 256
        reminderTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        timeZone:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - endpoint
        - p256dh
        - auth
        - reminderTime
        - timeZone
    ReminderUnsubscribeInput:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 4096
      required:
        - endpoint
    ReminderCheckInInput:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 4096
        hasCheckedInToday:
          type: boolean
      required:
        - endpoint
        - hasCheckedInToday
    ReminderSubscription:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        reminderTime:
          type: string
        timeZone:
          type: string
      required:
        - enabled
        - reminderTime
        - timeZone
    ReminderStatus:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required:
        - enabled

